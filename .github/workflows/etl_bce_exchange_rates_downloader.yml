name: ETL BCE Exchange Rates Downloader

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create credentials files
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > gcp_key.json

      - name: Run script
        env:
          GOOGLE_APPLICATION_CREDENTIALS: gcp_key.json
        run: python main_bce_exchange_rates.py
