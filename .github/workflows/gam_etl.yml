name: GAM ETL to BigQuery

on:
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

jobs:
  run-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create credentials files
        run: |
          echo '${{ secrets.GCP_SA_KEY }}' > gcp_key.json
          echo '${{ secrets.GAM_SA_KEY }}' > gam_key.json

      - name: Run script
        env:
          GOOGLE_APPLICATION_CREDENTIALS: gcp_key.json
          GAM_JSON_KEY: gam_key.json
        run: python main.py

      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
              server_address: smtp.office365.com
              server_port: 587
              secure: false
              username: ${{ secrets.OUTLOOK_USERNAME }}
              password: ${{ secrets.OUTLOOK_PASSWORD }}
              subject: "✅ ETL GAM completato con successo"
              to: tua.email@outlook.com
              from: GitHub Actions <${{ secrets.OUTLOOK_USERNAME }}>
              body: |
                Il workflow è terminato con successo.
          
                Repository: ${{ github.repository }}
                Workflow: ${{ github.workflow }}
                Run number: ${{ github.run_number }}
          
                Link:
                https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
